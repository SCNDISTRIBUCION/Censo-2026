<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b4a"><title>Relevamiento SCN</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="assets/styles.css"></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo">SCN</div><div><h1>Relevamiento comercial</h1><p id="connection">Modo local</p></div></div><button type="button" class="ghost" id="configBtn">Configurar</button></header>
<section class="view active" id="datos"><div class="card"><h2 class="section-title">Comercio visitado</h2><label>Relación con SCN<select id="tipoPunto"><option value="cliente">Cliente activo</option><option value="potencial">No cliente / potencial</option><option value="competencia">Competencia</option><option value="otro">Otro</option></select></label><div id="clienteBox"><label>Buscar en clientes activos<input id="clienteBuscar" placeholder="PDV, razón social, CUIT o domicilio" autocomplete="off"></label><div id="resultados" class="results"></div></div><label>Nombre del comercio<input id="nombre" required></label><div class="grid"><label>PDV<input id="pdv" readonly></label><label>Rubro<input id="rubro"></label></div><label>Dirección<input id="direccion"></label><div class="grid"><label>Localidad<input id="localidad"></label><label>Contacto / teléfono<input id="contacto"></label></div></div></section>
<section class="view" id="encuesta"><div class="card"><h2 class="section-title">Encuesta</h2><label>1. ¿Qué tipo de negocio es?</label><div class="chips" id="tipos"></div></div><div class="card"><label>2. ¿Comercializa productos que vende la distribuidora SCN?</label><div class="chips"><label class="chip"><input type="radio" name="comercializa" value="Sí"><span>Sí</span></label><label class="chip"><input type="radio" name="comercializa" value="No"><span>No</span></label></div><div id="branchSi" class="hidden"><label>3. Nombre del vendedor de SCN<small>Complete si el comercio es cliente de SCN.</small><input id="vendedorScn"></label><label>4. Frecuencia de visita del vendedor<small>Complete si el comercio es cliente de SCN.</small><select id="frecuenciaScn"><option value="">Seleccionar</option><option>Una vez por semana</option><option>Dos o más veces por semana</option><option>Cada quince días</option><option>Mensualmente</option><option>No recibe visitas</option></select></label></div><div id="branchNo" class="hidden"><label>3. ¿Dónde compra los productos que comercializa?<small>Complete si no es cliente de SCN.</small><textarea id="dondeCompra" rows="3"></textarea></label><label>4. Razón social del proveedor<small>Proveedor al que compra habitualmente.</small><input id="razonProveedor"></label></div><p id="surveyStatus" class="survey-status">Encuesta pendiente</p><button type="button" class="btn" id="confirmSurvey">Confirmar respuestas</button></div></section>
<section class="view" id="evidencia"><div class="card"><h2 class="section-title">Resultado y evidencia</h2><label>Resultado<select id="resultado"><option>Interesado</option><option>Revisitar</option><option>Venta realizada</option><option>Sin interés</option><option>Cerrado</option><option>No encontrado</option></select></label><label>Observaciones<textarea id="observaciones" rows="4"></textarea></label><label>Foto del local<input id="foto" type="file" accept="image/*" capture="environment"></label><div class="gps"><div><b>Ubicación</b><small id="gpsText">Pendiente</small></div><button type="button" class="ghost" id="gpsBtn">Capturar GPS</button></div><button type="button" class="btn" id="saveBtn">Guardar visita</button><p class="msg" id="msg"></p></div></section>
<section class="view" id="historial"><div class="card"><h2 class="section-title">Últimas visitas</h2><div id="visitList"></div></div></section></div>
<nav class="nav"><button type="button" class="active" data-view="datos">Datos</button><button type="button" data-view="encuesta">Encuesta</button><button type="button" data-view="evidencia">Guardar</button><button type="button" data-view="historial">Historial</button></nav>
<dialog id="config"><form method="dialog" class="card"><h2 class="section-title">Conectar Supabase</h2><label>Project URL<input id="sbUrl"></label><label>Clave pública<input id="sbKey" type="password"></label><button id="saveConfig" class="btn">Guardar</button></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js");</script></body></html>
